name: Gatilho de minuto dos lembretes

# Chama /api/disparar a cada 5 minutos. É o "despertador" do SPEC (seção 10,
# tarefa 10): a Vercel não serve para isso (cron do plano Hobby é 1x/dia,
# sem worker sempre ligado), então algo precisa ficar sempre de pé chamando
# essa rota. Aqui é o próprio GitHub Actions.
#
# Era "* * * * *" (a cada minuto) originalmente, mas na prática o GitHub
# simplesmente não disparou o schedule por 2h39 seguidas — confirmado pelo
# vigia (vigia.yml), que abriu um alerta de verdade. O GitHub documenta que
# schedules muito frequentes podem ser atrasados ou pulados sob carga da
# plataforma; 5 em 5 minutos é uma cadência que ele respeita melhor.
# Tolerável: o lembrete já sai com 15 min de folga (SPEC §3) e /api/disparar
# reprocessa qualquer coisa vencida na última hora.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {} # permite rodar manualmente pela aba Actions

jobs:
  disparar:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Chamar /api/disparar
        env:
          API_BASE: ${{ secrets.AGENDA_API_BASE }}
          DISPARAR_SECRET: ${{ secrets.DISPARAR_SECRET }}
        run: |
          resposta=$(curl -fsS --max-time 45 \
            -H "Authorization: Bearer ${DISPARAR_SECRET}" \
            "${API_BASE}/api/disparar")
          echo "resposta: $resposta"
          # Falha o job (fica visível na aba Actions) se não vier {"ok":true,...}.
          echo "$resposta" | grep -q '"ok":true'
